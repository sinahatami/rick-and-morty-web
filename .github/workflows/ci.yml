name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: '1'

jobs:
  quality:
    name: Types, lint and unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Find dead code and unused dependencies
        run: pnpm knip

      - name: Unit tests
        run: pnpm test

  e2e:
    name: Build, end-to-end tests and Lighthouse
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The static build reads a snapshot of the public API (see scripts/fetch-api-data.mjs). Reusing
      # a recent one keeps the build fast and spares the API.
      - name: Restore the API snapshot
        uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-snapshot-${{ github.run_id }}
          restore-keys: api-snapshot-

      - name: Build
        run: pnpm build

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium

      - name: End-to-end tests
        run: pnpm e2e

      - name: Upload the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

      - name: Lighthouse
        run: pnpm lhci

  release:
    name: Release and deploy
    needs: [quality, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    concurrency:
      group: release
      cancel-in-progress: false
    permissions:
      contents: write # tags, GitHub releases, CHANGELOG commit and the gh-pages branch
      issues: write
      pull-requests: write
    steps:
      - name: Check out
        uses: actions/checkout@v5
        with:
          fetch-depth: 0 # semantic-release reads the whole history

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Restore the API snapshot
        uses: actions/cache@v4
        with:
          path: .cache/api
          key: api-snapshot-${{ github.run_id }}
          restore-keys: api-snapshot-

      # Shown in the footer. semantic-release overwrites it with the new version if it publishes one.
      - name: Use the latest tag as the version
        run: |
          LATEST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "NEXT_PUBLIC_APP_VERSION=${LATEST_TAG#v}" > .env.production

      - name: Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: pnpm release

      - name: Build for GitHub Pages
        env:
          NEXT_PUBLIC_BASE_PATH: /rick-and-morty-web
        run: pnpm build

      - name: Deploy to GitHub Pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          pnpm run deploy:pages --message "Deploy ${GITHUB_SHA::7}"
